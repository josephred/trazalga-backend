# =====================================================================
# application-perf.properties
#
# Perfil dedicado a las pruebas de estres.
# COPIAR A: trazalga_backend_03/src/main/resources/application-perf.properties
#
# Levantar una SEGUNDA instancia del backend, en otro puerto, apuntando
# al schema de pruebas. NO reapuntar la instancia productiva:
#
#   java -jar target/api-0.0.1-SNAPSHOT.jar \
#        --spring.profiles.active=perf
#
# =====================================================================

# ---------------------------------------------------------------------
# Puerto distinto al productivo (8081) para poder correr en paralelo.
# ---------------------------------------------------------------------
server.port=8082

# ---------------------------------------------------------------------
# Base de datos: SCHEMA DE PRUEBAS, nunca el productivo.
#
# rewriteBatchedStatements=true : agrupa los INSERT en un solo paquete.
# cachePrepStmts + useServerPrepStmts : evita re-parsear cada sentencia.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/trazalga_perf?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=500&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
spring.datasource.username=perf_user
spring.datasource.password=CAMBIAR_ESTA_PASSWORD

# ---------------------------------------------------------------------
# ddl-auto = validate  (NO 'update')
#
# En una prueba de performance el esquema debe ser INMUTABLE. Con
# 'update', Hibernate puede alterar tablas al arrancar y dos corridas
# dejan de ser comparables. 'validate' falla ruidosamente si el esquema
# no coincide, que es exactamente lo que queremos saber.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate

# ---------------------------------------------------------------------
# LOGS APAGADOS  <-- critico
#
# Con show-sql=true y bind=TRACE, el I/O de logs domina la medicion y
# esconde el problema real. Es uno de los errores mas comunes al medir.
# ---------------------------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=WARN
logging.level.com.trazalga=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.file.name=logs/trazalga_perf.log

# ---------------------------------------------------------------------
# generate_statistics = false
# La instrumentacion de Hibernate agrega overhead en cada operacion.
# Activala solo si estas diagnosticando un problema puntual.
# ---------------------------------------------------------------------
spring.jpa.properties.hibernate.generate_statistics=false

# ---------------------------------------------------------------------
# HikariCP — dimensionamiento EXPLICITO
#
# El default es 10, que es el primer techo que se golpea con concurrencia.
# Formula de referencia:  ((cores * 2) + discos)
# Para 4 cores + SSD:     (4*2)+1 = 9  ->  se usa 20 para dar margen.
#
# Un pool GRANDE no da mas throughput: da mas contencion. Verificalo
# empiricamente variando este valor entre corridas; es contraintuitivo.
# ---------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=TrazalgaPerfPool

# ---------------------------------------------------------------------
# Batching JPA
# ---------------------------------------------------------------------
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# Tamano de fetch: reduce los round-trips al traer muchas filas.
# ---------------------------------------------------------------------
spring.jpa.properties.hibernate.jdbc.fetch_size=200

# ---------------------------------------------------------------------
# ACTUATOR — metricas para 04_snapshot_metrics.sh y Prometheus
#
# En este perfil se exponen todos los endpoints porque es un entorno de
# pruebas aislado. NUNCA hacer esto en el perfil de produccion.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,metrics,prometheus,threaddump,heapdump
management.endpoint.health.show-details=always
management.metrics.tags.application=trazalga-perf
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1s,2s,5s

# ---------------------------------------------------------------------
# Zona horaria: igual que produccion, para que las fechas coincidan.
# ---------------------------------------------------------------------
spring.jackson.time-zone=America/Santiago

# ---------------------------------------------------------------------
# Sincronizacion con SERNAPESCA DESACTIVADA.
# Una llamada externa durante la prueba mide la latencia de la API de
# SERNAPESCA, no la del sistema. Y ademas seria descortes.
# ---------------------------------------------------------------------
trazalga.sync.buzos.regiones=

# =====================================================================
# FLAGS RECOMENDADOS DE LA JVM
#
# java -XX:+UseG1GC \
#      -Xms2g -Xmx4g \
#      -XX:MaxGCPauseMillis=200 \
#      -XX:+HeapDumpOnOutOfMemoryError \
#      -XX:HeapDumpPath=./logs/heapdump.hprof \
#      -XX:StartFlightRecording=duration=0,filename=./logs/perf.jfr,settings=profile \
#      -jar target/api-0.0.1-SNAPSHOT.jar --spring.profiles.active=perf
#
# HeapDumpOnOutOfMemoryError: si findAll() sobre 500k revienta la JVM
# (hallazgo H2), el heap dump te dice exactamente que lo lleno.
#
# StartFlightRecording: JFR viene incluido en el JDK 21, tiene <2% de
# overhead y produce flamegraphs. Abrir el .jfr con JDK Mission Control.
# =====================================================================
