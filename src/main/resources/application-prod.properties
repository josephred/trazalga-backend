# Base de Datos (Local al servidor .199)
spring.datasource.url=jdbc:mysql://localhost:3306/trazalga?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username=toor
