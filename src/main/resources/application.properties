# ===============================================
# NOMBRE DE LA APLICACIÓN
# ===============================================
spring.application.name=api

# ===============================================
# CONFIGURACIÓN DEL SERVIDOR WEB
# ===============================================
# Usamos el puerto 9999 para evitar conflictos con Metro (8081)
server.port=8091
# IMPORTANTE: Eliminamos 'server.address=127.0.0.1' para que el servidor
# acepte conexiones desde otros dispositivos en la red (como tu móvil).

# ===============================================
# CONFIGURACIÓN DE LA BASE DE DATOS (DataSource)
# ===============================================
# URL de conexión a tu base de datos MySQL.
# Asegúrate de que MySQL esté corriendo en 'localhost' (esta misma máquina).
# y que la base de datos 'trazalga' exista.
spring.datasource.url=jdbc:mysql://localhost:3306/trazalga?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Usuario de la base de datos.
spring.datasource.username=toor

# Contraseña del usuario de la base de datos.
spring.datasource.password=567890

# Driver de MySQL (DESCOMENTADO Y REQUERIDO)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ===============================================
# El dialecto de MySQL que usará Hibernate (DESCOMENTADO Y REQUERIDO)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 'update' intentará actualizar el esquema de la base de datos. Bueno para desarrollo.
spring.jpa.hibernate.ddl-auto=update


