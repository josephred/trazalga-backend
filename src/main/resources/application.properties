# ===============================================
# CONFIGURACIÓN COMÚN
# ===============================================
spring.application.name=api

# Perfil activo por defecto (si no se especifica uno)
spring.profiles.active=dev

# Puerto del servidor
server.port=8081

# Driver de Base de Datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Seguridad JWT
trazalga.jwt.secret=EstaEsUnaClaveSuperSecretaParaSernapesca2024
trazalga.jwt.expiration=86400000

# Optimizaciones JPA (Comunes)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.open-in-view=false

# Interpretar las fechas JSON en hora de Chile. Sin esto, Jackson parsea
# "2026-07-18" como medianoche UTC y la truncación a DATE en hora local
# (UTC-4) guarda 2026-07-17: las declaraciones quedan un día antes.
spring.jackson.time-zone=America/Santiago

# ===============================================
# API DE SERNAPESCA (poblamiento de datos maestros)
# ===============================================
sernapesca.api.base-url=https://data-api.sernapesca.cl
sernapesca.api.connect-timeout-ms=15000
sernapesca.api.read-timeout-ms=60000

# Códigos de región (CSV) a sincronizar para buzos. Por defecto solo la 4 (Coquimbo)
# para evitar cargar la nómina nacional completa (~63k registros / ~5.7 MB).
trazalga.sync.buzos.regiones=4

# Ruta al archivo de credenciales de Firebase (puede ser classpath:... o file:...)
trazalga.firebase.config-path=classpath:firebase-service-account.json

# Almacenamiento local de adjuntos (NA.4: fotos de voucher romana y guías de despacho)
trazalga.adjuntos.dir=${TRAZALGA_ADJUNTOS_DIR:uploads/adjuntos}
trazalga.adjuntos.max-mb=10
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Consulta pública de patentes (ZC.6 / YC.2): proxies confiables y secreto HMAC para ip_hash
trazalga.proxy.confiables=${TRAZALGA_PROXY_CONFIABLES:}
trazalga.consulta.ip-hash-secret=${TRAZALGA_IP_HASH_SECRET:}

# Seguridad en lecturas (ZS.2 / YD.2): cierra GET de declaraciones, usuarios y envíos sin sesión JWT
trazalga.seguridad.lecturas-autenticadas=${TRAZALGA_SEGURIDAD_LECTURAS_AUTENTICADAS:true}
