# ===============================================
# CONFIGURACIÓN COMÚN
# ===============================================
spring.application.name=api

# Perfil activo por defecto (si no se especifica uno)
spring.profiles.active=dev

# Puerto del servidor
server.port=8091

# Driver de Base de Datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Seguridad JWT
trazalga.jwt.secret=EstaEsUnaClaveSuperSecretaParaSernapesca2024
trazalga.jwt.expiration=86400000

# Optimizaciones JPA (Comunes)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.open-in-view=false

# ===============================================
# API DE SERNAPESCA (poblamiento de datos maestros)
# ===============================================
sernapesca.api.base-url=https://data-api.sernapesca.cl
sernapesca.api.connect-timeout-ms=15000
sernapesca.api.read-timeout-ms=60000

# Códigos de región (CSV) a sincronizar para buzos. Por defecto solo la 4 (Coquimbo)
# para evitar cargar la nómina nacional completa (~63k registros / ~5.7 MB).
trazalga.sync.buzos.regiones=4
