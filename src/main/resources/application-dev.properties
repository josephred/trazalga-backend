# ===============================================
# CONFIGURACIÓN DE DESARROLLO / QA (.210)
# ===============================================

# Base de Datos (Local al servidor .210)
spring.datasource.url=jdbc:mysql://192.168.100.199:3306/trazalga_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=1234

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.root=INFO
logging.level.com.trazalga=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.file.name=logs/trazalga_dev.log
