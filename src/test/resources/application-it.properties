# ================================================================================
# PERFIL DE INTEGRACIÓN (TA.1)
# Configuración idéntica a producción para pruebas de integración reales:
# - spring.jpa.open-in-view=false (sin filtración de sesión JPA a la capa web)
# - SIN enable_lazy_load_no_trans (falla de inmediato con LazyInitializationException
#   si se accede a relaciones @ManyToOne / @OneToMany no inicializadas fuera de @Transactional)
# - H2 en compatibilidad MODE=MySQL
# ================================================================================
spring.datasource.url=jdbc:h2:mem:itdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Auditoría / tareas programadas
trazalga.alertas.cron=0 0 6 * * *
trazalga.retencion.cron=0 */15 * * * *
