# ================================================================================
# PERFIL DE PRUEBA HISTÓRICO (LEGADO)
# ⚠️ NO USAR PARA PRUEBAS NUEVAS:
# hibernate.enable_lazy_load_no_trans=true enmascara errores de LazyInitializationException
# que sí ocurren en producción cuando open-in-view=false.
#
# Para pruebas nuevas, extender IntegracionBase o anotar con @ActiveProfiles("it")
# usando application-it.properties (TA.1).
# ================================================================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
